   let stored=saveSession(result.hashedPassword,expiresAt);
   if(remember){
    const savedHash=write('localStorage',keys.hash,result.hashedPassword);
    const savedExpiry=write('localStorage',keys.expiry,String(expiresAt));
    if(!savedHash||!savedExpiry){clearRemembered();stored=false;}
   }else clearRemembered();
   showPage(!stored);
  }catch(_){error.textContent='無法解鎖，請使用支援 HTTPS 的新版瀏覽器。';}
  finally{button.disabled=false;}
 });
})();
</script></body></html>
